      <h1>안내서비스 검색</h1>
      <p class="subtitle">서비스명으로 찾고 안내분야별로 빠르게 걸러보세요.</p>

    <section class="panel" aria-label="검색 및 필터">

        <label class="field">
          <span>서비스명 검색</span>

        </label>
        <label class="field">
          <span>안내분야</span>

            <option value="교육">교육</option><option value="교통">교통</option><option value="민원">민원</option><option value="복지">복지</option><option value="세금">세금</option><option value="일자리">일자리</option><option value="재난">재난</option>
          </select>
        </label>
        <button id="resetBtn" type="button" class="reset">초기화</button>
      </div>
      <div class="summary" aria-live="polite">
        <strong id="visibleCount">현재 표시 24건</strong>
        <span>전체 24건</span>
      </div>
    </section>

    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>

            </tr>
          </thead>
          <tbody id="serviceTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty" hidden>조건에 맞는 서비스가 없습니다.</div>
    </section>
